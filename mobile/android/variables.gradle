ext {
    // 26, not 24. A transfer sends its payload as base64 and asks the native
    // side to decode it, and that decode is guarded by SDK_INT >= 26 in
    // Capacitor's own code. On 24 and 25 the guard simply skips the write, so
    // the body goes out empty with nothing reporting an error and the transfer
    // fails at the far end for no visible reason. Refusing to install on those
    // two versions is better than installing and quietly not working.
    minSdkVersion = 26
    compileSdkVersion = 36
    targetSdkVersion = 36
    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    coreSplashScreenVersion = '1.2.0'
    androidxWebkitVersion = '1.14.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
    cordovaAndroidVersion = '14.0.1'
}