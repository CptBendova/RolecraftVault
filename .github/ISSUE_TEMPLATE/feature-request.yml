name: Feature request
description: Suggest a focused improvement
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What user problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested experience
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [All editions, Windows app, Android APK, Browser edition]
    validations:
      required: true
