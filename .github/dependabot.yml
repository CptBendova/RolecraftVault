version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /mobile
    schedule:
      interval: weekly
    ignore:
      # 8.5.0 reintroduces the xcode/uuid advisory chain removed in 1.245.
      - dependency-name: "@capacitor/cli"
        versions: ["8.5.0"]
  - package-ecosystem: gradle
    directory: /mobile/android
    schedule:
      interval: monthly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
