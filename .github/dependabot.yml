version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /mobile
    schedule:
      interval: weekly
    ignore:
      # Every 8.5.x release so far (8.5.0 to 8.5.2) reintroduces the xcode/uuid
      # chain removed in 1.245, and test-release-engineering.js rejects it.
      # 8.4.3 carries the maintained patch without that iOS-only dependency.
      - dependency-name: "@capacitor/cli"
        versions: ["8.5.x"]
  - package-ecosystem: gradle
    directory: /mobile/android
    schedule:
      interval: monthly
    ignore:
      # The current Android Gradle plugin cannot use the proposed Gradle 9.7.
      # Keep compatible patch/minor updates until the Android toolchain migrates.
      - dependency-name: "gradle-wrapper"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
