version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /mobile
    schedule:
      interval: weekly
    ignore:
      # 8.5.0 and 8.5.1 reintroduce the xcode/uuid chain removed in 1.245.
      # 8.4.3 carries the maintained patch without that iOS-only dependency.
      - dependency-name: "@capacitor/cli"
        versions: ["8.5.0", "8.5.1"]
  - package-ecosystem: gradle
    directory: /mobile/android
    schedule:
      interval: monthly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
